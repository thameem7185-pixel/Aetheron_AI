<style>
  :root {
    --bg: #f5f5f7;
    --surface: #ffffff;
    --surface-2: #eeeef2;
    --text: #1b1b1f;
    --muted: #6e6e78;
    --line: #e4e4ea;
    --accent: #4f5bd5;
    --accent-text: #ffffff;
    --code-bg: #f4f4f7;
    --danger: #d13438;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 28px rgba(0,0,0,.07);
    --sidebar-w: 264px;
    --font: 'Segoe UI Variable', 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif;
    --mono: ui-monospace, 'SF Mono', Consolas, 'Courier New', monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151517;
      --surface: #1e1e22;
      --surface-2: #2a2a30;
      --text: #ececf1;
      --muted: #9a9aa6;
      --line: #2d2d34;
      --accent: #7b86ff;
      --accent-text: #101014;
      --code-bg: #121215;
      --danger: #ff6b6f;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px rgba(0,0,0,.35);
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    font-family: var(--font);
    color: var(--text);
    background: radial-gradient(1100px 480px at 50% -12%, rgba(79,91,213,.09), transparent), var(--bg);
    overflow: hidden;
  }

  button { font-family: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
  svg { display: block; }

  /* ── layout ── */
  #app { height: 100vh; height: 100dvh; display: flex; }

  #sidebar {
    width: var(--sidebar-w);
    flex-shrink: 0;
    margin-left: calc(-1 * var(--sidebar-w));
    background: var(--surface);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    padding: calc(10px + env(safe-area-inset-top)) 10px calc(10px + env(safe-area-inset-bottom));
    transition: margin-left .25s ease, transform .25s ease;
    z-index: 30;
  }
  body.sidebar-open #sidebar { margin-left: 0; }

  .sb-head { display: none; align-items: center; justify-content: space-between; padding: 4px 6px 12px 10px; }
  .brand { font-weight: 600; font-size: 1.05rem; letter-spacing: .2px; }

  .new-chat {
    display: flex; align-items: center; gap: 10px;
    width: 100%; padding: 10px 12px; margin-bottom: 18px;
    border: 1px solid var(--line); border-radius: 12px;
    font-size: .92rem; font-weight: 500;
    transition: background .15s;
  }
  .new-chat:hover { background: var(--surface-2); }

  .sb-label { font-size: .72rem; color: var(--muted); padding: 0 12px 6px; text-transform: uppercase; letter-spacing: .08em; }

  .mode-btn, .row-btn {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; text-align: left;
    padding: 10px 12px; border-radius: 10px;
    font-size: .93rem; color: var(--text);
    transition: background .15s;
  }
  .mode-btn:hover, .row-btn:hover { background: var(--surface-2); }
  .mode-btn.active { background: var(--surface-2); font-weight: 600; }

  .sb-spacer { flex: 1; }
  .sb-foot { border-top: 1px solid var(--line); padding-top: 8px; }

  .switch { width: 34px; height: 20px; border-radius: 10px; background: var(--line); position: relative; transition: background .2s; flex-shrink: 0; }
  .switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
  .switch.on { background: var(--accent); }
  .switch.on::after { transform: translateX(14px); }

  #scrim { display: none; }

  #main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  #topbar {
    height: calc(54px + env(safe-area-inset-top));
    padding: env(safe-area-inset-top) 10px 0;
    display: flex; align-items: center; gap: 6px; flex-shrink: 0;
  }
  #topbar .brand { font-size: 1rem; }
  #topbar .spacer { flex: 1; }

  .icon-btn {
    width: 38px; height: 38px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--muted); flex-shrink: 0;
    transition: background .15s, color .15s;
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); }
  .icon-btn:disabled { opacity: .4; cursor: default; }
  .icon-btn.sm { width: 30px; height: 30px; }

  /* ── chat ── */
  #chat-window {
    flex: 1; overflow-y: auto; overflow-x: hidden;
    padding: 8px 16px 24px;
    display: flex; flex-direction: column;
    scroll-behavior: smooth;
  }
  #chat-window::-webkit-scrollbar { width: 6px; }
  #chat-window::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }

  #welcome { margin: auto; text-align: center; padding: 0 8px 6vh; max-width: 640px; }
  #welcome h1 { font-size: clamp(1.7rem, 5vw, 2.3rem); font-weight: 600; letter-spacing: -.02em; margin-bottom: 26px; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .chip {
    padding: 10px 16px; border: 1px solid var(--line); border-radius: 999px;
    background: var(--surface); font-size: .9rem; color: var(--text);
    transition: background .15s, border-color .15s;
  }
  .chip:hover { background: var(--surface-2); }

  .msg { width: 100%; max-width: 760px; margin: 0 auto 20px; display: flex; flex-direction: column; }
  .msg.user { align-items: flex-end; }
  .msg.user .bubble {
    background: var(--surface-2); border-radius: 20px; padding: 10px 16px;
    max-width: 85%; white-space: pre-wrap; word-break: break-word; line-height: 1.55;
  }
  .msg.assistant .bubble { line-height: 1.7; font-size: 1rem; white-space: pre-wrap; word-break: break-word; }
  .bubble.error { color: var(--danger); }

  .bubble h1, .bubble h2, .bubble h3 { font-weight: 600; margin: 14px 0 4px; line-height: 1.3; }
  .bubble h1 { font-size: 1.3rem; } .bubble h2 { font-size: 1.15rem; } .bubble h3 { font-size: 1.05rem; }
  .bubble ul { margin: 6px 0 6px 1.3em; white-space: normal; }
  .bubble li { margin: 3px 0; }
  .bubble blockquote { border-left: 3px solid var(--line); padding-left: 12px; color: var(--muted); margin: 6px 0; }
  .bubble hr { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }
  .bubble a { color: var(--accent); }
  .bubble code { font-family: var(--mono); font-size: .88em; background: var(--code-bg); padding: 2px 6px; border-radius: 6px; }

  .code-wrap { background: var(--code-bg); border: 1px solid var(--line); border-radius: 12px; margin: 10px 0; overflow: hidden; white-space: normal; }
  .code-actions { display: flex; justify-content: flex-end; gap: 2px; padding: 4px 6px; border-bottom: 1px solid var(--line); }
  .code-actions button { font-size: .75rem; color: var(--muted); padding: 4px 10px; border-radius: 8px; }
  .code-actions button:hover { background: var(--surface-2); color: var(--text); }
  .code-wrap pre { padding: 14px; overflow-x: auto; white-space: pre; tab-size: 2; }
  .code-wrap pre code { background: none; padding: 0; font-size: .85rem; line-height: 1.55; }

  .msg-actions { display: flex; gap: 2px; margin-top: 4px; margin-left: -6px; opacity: .55; transition: opacity .15s; }
  .msg:hover .msg-actions, .msg-actions:focus-within { opacity: 1; }
  .msg-actions .icon-btn.copied, .msg-actions .icon-btn.speaking { color: var(--accent); }

  .dots { display: flex; gap: 5px; padding: 10px 0; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: bounce 1.2s infinite ease-in-out; }
  .dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%, 80%, 100% { opacity: .25; transform: scale(.8); } 40% { opacity: 1; transform: scale(1); } }

  /* ── composer ── */
  #composer-wrap { padding: 0 16px calc(14px + env(safe-area-inset-bottom)); flex-shrink: 0; }

  #attachments-row { display: none; max-width: 760px; margin: 0 auto 8px; flex-wrap: wrap; gap: 6px; }
  #attachments-row.show { display: flex; }
  .attach-chip { display: inline-flex; align-items: center; gap: 4px; padding: 5px 6px 5px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; font-size: .8rem; max-width: 100%; }
  .chip-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 180px; }
  .chip-remove { width: 20px; height: 20px; border-radius: 50%; color: var(--muted); font-size: .7rem; }
  .chip-remove:hover { background: var(--surface-2); color: var(--text); }

  #input-bar {
    max-width: 760px; margin: 0 auto;
    display: flex; align-items: flex-end; gap: 2px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 28px;
    box-shadow: var(--shadow); padding: 6px 8px;
    transition: border-color .15s;
  }
  #input-bar:focus-within { border-color: var(--accent); }
  #msg-input {
    flex: 1; min-width: 0; border: 0; outline: 0; resize: none; background: transparent;
    font: inherit; font-size: 16px; line-height: 1.5; color: var(--text);
    padding: 8px 6px; max-height: 160px;
  }
  #msg-input::placeholder { color: var(--muted); }
  #attach-btn.has-files { color: var(--accent); }
  #mic-btn.recording { color: var(--danger); animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .45; } }
  #send-btn { background: var(--accent); color: var(--accent-text); }
  #send-btn:hover { background: var(--accent); color: var(--accent-text); filter: brightness(1.1); }
  #send-btn:disabled { background: var(--surface-2); color: var(--muted); filter: none; opacity: 1; }

  #toast {
    position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom));
    transform: translate(-50%, 10px); opacity: 0; pointer-events: none;
    background: var(--text); color: var(--bg);
    padding: 8px 16px; border-radius: 999px; font-size: .85rem;
    transition: opacity .2s, transform .2s; z-index: 50;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ── phone: sidebar becomes a slide-over drawer ── */
  @media (max-width: 859px) {
    #sidebar { position: fixed; top: 0; bottom: 0; left: 0; margin-left: 0; transform: translateX(-100%); box-shadow: var(--shadow); width: min(82vw, 300px); }
    body.sidebar-open #sidebar { transform: none; }
    .sb-head { display: flex; }
    #scrim { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.35); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 20; }
    body.sidebar-open #scrim { opacity: 1; pointer-events: auto; }
  }
</style>
</head>
<body>

<div id="app">
  <aside id="sidebar">
    <div class="sb-head">
      <span class="brand" data-app-name></span>
      <button class="icon-btn sb-close" onclick="toggleSidebar(false)" aria-label="Close menu">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>

  <div id="main">

          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l8.6-8.6a3.7 3.7 0 0 1 5.2 5.2l-8.6 8.6a1.8 1.8 0 0 1-2.6-2.6l7.9-7.9"/></svg>

        </button>
      </div>

  </div>
</div>

<div id="toast"></div>

<script>
const WORKER_URL = 'https://nuxus3211.thameem7185.workers.dev';

// ElevenLabs Configuration (Replace YOUR_ELEVENLABS_API_KEY with your key)
const ELEVENLABS_API_KEY = "YOUR_ELEVENLABS_API_KEY"; 
// J.A.R.V.I.S Style Voice ID (Defaulting to George - Warm, British Male Voice)

let currentMode = 'chat';
let messages = [];
let isThinking = false;
let totalTokens = 0;
let msgCount = 0;
let attachedFiles = []; 
let msgUid = 0;
const rawMessageStore = {};
const codeSnippetStore = {};

let recognition = null;
let isRecording = false;
let autoVoiceMode = false;
let jarvisVoice = null;
let currentAudioSource = null;
let audioCtx = null;
let currentSpeakingBtn = null;


// ───────────────────────────────────────────────
//  CHANGE THE AI'S NAME HERE (only place you need to edit)
// ───────────────────────────────────────────────
const APP_NAME = 'Aetheron';

const svgIcon = p => `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const ICON_MIC   = svgIcon('<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>');
const ICON_STOP  = svgIcon('<rect x="6.5" y="6.5" width="11" height="11" rx="2" fill="currentColor"/>');
const ICON_SPEAK = svgIcon('<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/>');
const ICON_COPY  = svgIcon('<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/>');
const ICON_CHECK = svgIcon('<path d="M5 12.5l4.5 4.5L19 7.5"/>');

const modePlaceholders = {
  chat: 'Message ' + APP_NAME,
  code: 'Describe the code you need',
  complex: 'Ask something hard'
};
const WELCOME_CHIPS = [
  { label: 'Explain quantum entanglement', prompt: 'Explain quantum entanglement in detail with mathematical foundations' },
  { label: 'Write a Node.js REST API',     prompt: 'Write a complete REST API server in Node.js with authentication' },
  { label: 'Help me plan my week',         prompt: 'Help me plan a productive week. Ask me what I need to get done.' }
];

document.title = APP_NAME;
document.querySelectorAll('[data-app-name]').forEach(el => el.textContent = APP_NAME);
if (window.innerWidth >= 860) document.body.classList.add('sidebar-open');
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && window.innerWidth < 860) toggleSidebar(false);
});

function toggleSidebar(force) {
  const open = typeof force === 'boolean' ? force : !document.body.classList.contains('sidebar-open');
  document.body.classList.toggle('sidebar-open', open);
}
function closeSidebarOnMobile() { if (window.innerWidth < 860) toggleSidebar(false); }

function updatePlaceholder() {
  document.getElementById('msg-input').placeholder = modePlaceholders[currentMode] || ('Message ' + APP_NAME);
}

function setMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.mode-btn[data-mode]').forEach(b =>
    b.classList.toggle('active', b.dataset.mode === mode)
  );
  updatePlaceholder();
  closeSidebarOnMobile();
}

function renderWelcome() {
  const win = document.getElementById('chat-window');
  win.innerHTML = '<div id="welcome"><h1>How can I help today?</h1><div class="chips"></div></div>';
  const chips = win.querySelector('.chips');
  WELCOME_CHIPS.forEach(c => {
    const b = document.createElement('button');
    b.className = 'chip';
    b.textContent = c.label;
    b.onclick = () => quickPrompt(c.prompt);
    chips.appendChild(b);
  });
}

renderWelcome();
updatePlaceholder();
document.getElementById('mic-btn').innerHTML = ICON_MIC;

function getSystemPrompt() {
  if (currentMode === 'code') {
    return `You are ${APP_NAME} CODE ENGINE — an elite AI programming assistant with expert-level mastery of every programming language, framework, and paradigm. Precision and correctness are your highest priorities — higher than speed or verbosity.

Before answering:
- Mentally trace through the logic step by step. Verify it actually works for the stated inputs, including typical edge cases (empty input, zero, negative numbers, off-by-one boundaries, null/undefined, large inputs).
- Double-check syntax for the exact language/version requested. Do not mix syntax from different languages or versions.
- If a requirement is ambiguous, state the assumption you're making in one line, then proceed — don't guess silently.

Your responses:
- Always wrap code in markdown code blocks with the language specified.
- Provide complete, working, production-ready code — never pseudocode, never partial snippets with "// rest of code here" unless explicitly asked for a snippet.
- Include comments only where they clarify non-obvious logic — don't narrate the obvious.
- Proactively call out any bugs, race conditions, security issues, or performance traps in the approach, and fix them rather than leaving them in.
- Handle realistic error cases and edge cases by default, not just the happy path.
- If you are not fully certain a piece of code is correct, say so explicitly rather than presenting it with false confidence.
- Never truncate code. Never leave a function half-implemented.

You are meticulous, technical, and exacting. Treat every line of code as something that will run in production and be reviewed by a senior engineer — it must be correct the first time.`;
  }
  if (currentMode === 'complex') {
    return `You are ${APP_NAME} DEEP THINK — a superintelligent reasoning system specialized in solving the most complex problems in science, mathematics, philosophy, logic, engineering, and research.
Your approach:
- Break down problems into structured components using first principles
- Show your reasoning step-by-step with mathematical rigor when needed
- Consider multiple angles and competing hypotheses
- Use formal notation, equations, and proofs where appropriate
- Synthesize information across disciplines
- Identify assumptions and limitations in your analysis
- Provide definitive answers with high confidence AND acknowledge genuine uncertainty
- Go deep. Be exhaustive. Leave nothing on the table.
You are operating at the frontier of human knowledge.`;
  }
  return `You are ${APP_NAME} — a cutting-edge AI assistant with vast knowledge across all domains.
You are direct, intelligent, and genuinely helpful. You can:
- Answer any question with depth and clarity
- Solve complex problems step by step
- Write, debug, and explain code
- Analyze data and research
- Create creative content
- Provide expert-level explanations

Format your responses with markdown when helpful. Be conversational but precise.`;
}

const TEXT_EXT = /\.(txt|md|markdown|json|js|jsx|ts|tsx|py|java|c|cpp|h|hpp|cs|go|rs|php|rb|swift|kt|sql|sh|yml|yaml|xml|html|css|csv|log)$/i;
const MAX_FILE_SIZE = 2 * 1024 * 1024;

function openFileDrawer() {
  document.getElementById('file-input').click();
}

function handleFileSelect(event) {
  const files = Array.from(event.target.files || []);
  files.forEach(file => {
    const isText = TEXT_EXT.test(file.name) || file.type.startsWith('text/');
    const entry = { name: file.name, size: file.size, content: '', isText, loaded: !isText };
    attachedFiles.push(entry);

    if (isText) {
      if (file.size > MAX_FILE_SIZE) {
        entry.content = '';
        entry.loaded = true;
        entry.tooLarge = true;
      } else {
        const reader = new FileReader();
        reader.onload = e => {
          entry.content = e.target.result;
          entry.loaded = true;
          renderAttachments();
        };
        reader.onerror = () => {
          entry.loaded = true;
          entry.tooLarge = true;
          renderAttachments();
        };
        reader.readAsText(file);
      }
    }
  });
  renderAttachments();
  event.target.value = '';
  showToast(files.length === 1 ? 'File attached' : files.length + ' files attached');
}

function removeAttachment(idx) {
  attachedFiles.splice(idx, 1);
  renderAttachments();
}

function renderAttachments() {
  const row = document.getElementById('attachments-row');
  const attachBtn = document.getElementById('attach-btn');
  if (!attachedFiles.length) {
    row.classList.remove('show');
    row.innerHTML = '';
    attachBtn.classList.remove('has-files');
    return;
  }
  attachBtn.classList.add('has-files');
  row.classList.add('show');
  row.innerHTML = attachedFiles.map((f, i) => `
    <div class="attach-chip">
      <span class="chip-name" title="${escHtml(f.name)}">${escHtml(f.name)}</span>
      <button class="chip-remove" onclick="removeAttachment(${i})" title="Remove">✕</button>
    </div>`).join('');
}

function buildAttachmentContext() {
  if (!attachedFiles.length) return '';
  const parts = attachedFiles.map(f => {
    if (f.isText && f.content) {
      return `--- FILE: ${f.name} ---\n${f.content}\n--- END FILE ---`;
    }
    return `--- FILE: ${f.name} (binary/unreadable, name only) ---`;
  });
  return parts.join('\n\n') + '\n\n';
}


async function sendMessage() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if ((!text && !attachedFiles.length) || isThinking) return;

  const pendingFiles = attachedFiles.filter(f => f.isText && !f.loaded);
  if (pendingFiles.length) { showToast('Still reading files...'); return; }

  const attachmentContext = buildAttachmentContext();
  const fileNames = attachedFiles.map(f => f.name);
  const fullPrompt = attachmentContext + (text || '(see attached file(s))');

  input.value = '';
  autoResize(input);
  hideWelcome();

  const displayText = fileNames.length
    ? `${text ? text + '\n\n' : ''}📎 ${fileNames.join(', ')}`
    : text;

  appendMessage('user', displayText);
  messages.push({ role: 'user', content: fullPrompt });
  msgCount++;

  attachedFiles = [];
  renderAttachments();

  await callCohere();
}

async function quickPrompt(text) {
  document.getElementById('msg-input').value = text;
  await sendMessage();
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey && window.innerWidth >= 860) {
    e.preventDefault();
    sendMessage();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 160) + 'px';
}

function initRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;
  const rec = new SR();
  rec.continuous = false;
  rec.interimResults = true;
  rec.lang = 'en-US';

  rec.onstart = () => {
    isRecording = true;
    const btn = document.getElementById('mic-btn');
    btn.classList.add('recording');
    btn.innerHTML = ICON_STOP;
  };

  rec.onresult = (e) => {
    let finalTranscript = '';
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) finalTranscript += t;
      else interim += t;
    }
    const input = document.getElementById('msg-input');
    input.value = (finalTranscript || interim).trim();
    autoResize(input);
    if (finalTranscript) rec._gotFinal = true;
  };

  rec.onerror = (e) => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      showToast('Microphone access denied');
    } else if (e.error !== 'no-speech' && e.error !== 'aborted') {
      showToast('Voice input error: ' + e.error);
    }
  };

  rec.onend = () => {
    isRecording = false;
    const btn = document.getElementById('mic-btn');
    btn.classList.remove('recording');
    btn.innerHTML = ICON_MIC;
    if (rec._gotFinal && document.getElementById('msg-input').value.trim()) {
      rec._gotFinal = false;
      sendMessage();
    }
  };

  return rec;
}

recognition = initRecognition();

function toggleRecording() {
  stopSpeaking();
  if (!recognition) recognition = initRecognition();
  if (!recognition) {
    showToast('Voice input isn\'t supported in this browser');
    return;
  }
  if (isRecording) {
    recognition.stop();
  } else {
    if (isThinking) return;
    try {
      document.getElementById('msg-input').value = '';
      recognition.start();
    } catch (err) {
      recognition.stop();
    }
  }
}

/* ────────────────────────────────────────────────
   VOICE OUTPUT ENGINE (ELEVENLABS + FALLBACK)
   ──────────────────────────────────────────────── */
function pickJarvisVoice() {
  const voices = speechSynthesis.getVoices();
  if (!voices.length) return null;
  const preferenceOrder = [
    v => /Daniel/i.test(v.name) && /en-GB/i.test(v.lang),
    v => /Google UK English Male/i.test(v.name),
    v => /Microsoft Ryan/i.test(v.name),
    v => /en-GB/i.test(v.lang),
    v => /male/i.test(v.name) && /en/i.test(v.lang),
  ];
  for (const test of preferenceOrder) {
    const match = voices.find(test);
    if (match) return match;
  }
  return voices[0];
}

if ('speechSynthesis' in window) {
  speechSynthesis.onvoiceschanged = () => { jarvisVoice = pickJarvisVoice(); };
  jarvisVoice = pickJarvisVoice();
}

function stripForSpeech(text) {
  return text
    .replace(/```[\s\S]*?```/g, ' Code block omitted. ')
    .replace(/`([^`]+)`/g, '$1')
    .replace(/!\[[^\]]*\]\([^)]*\)/g, '')
    .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')
    .replace(/[*_#>~]/g, '')
    .replace(/^\s*[-•]\s+/gm, '')
    .replace(/\n{2,}/g, '. ')
    .replace(/\n/g, ' ')
    .trim();
}

function stopSpeaking() {
  speakId++;
  if (currentAudioSource) {
    try { currentAudioSource.stop(); } catch(e){}
    currentAudioSource = null;
  }
  if (speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel();
  if (currentSpeakingBtn) {
    currentSpeakingBtn.classList.remove('speaking');
    currentSpeakingBtn.innerHTML = ICON_SPEAK;
  }
  currentSpeakingBtn = null;
}

/* ── FREE NEURAL VOICE (British male "Brian") + Jarvis audio effect ── */
const FREE_TTS_VOICE = 'Brian';
const ttsCache = new Map();

function fetchTTS(text) {
  if (ttsCache.has(text)) return ttsCache.get(text);
  const p = fetch('https://api.streamelements.com/kappa/v2/speech?voice=' + FREE_TTS_VOICE + '&text=' + encodeURIComponent(text))
    .then(r => { if (!r.ok) throw new Error('TTS HTTP ' + r.status); return r.arrayBuffer(); })
    .then(buf => audioCtx.decodeAudioData(buf));
  p.catch(() => ttsCache.delete(text));
  ttsCache.set(text, p);
  if (ttsCache.size > 40) ttsCache.delete(ttsCache.keys().next().value);
  return p;
}

function playJarvis(buffer, myId) {
  return new Promise(resolve => {
    const src = audioCtx.createBufferSource();
    src.buffer = buffer;
    src.playbackRate.value = 0.97;            // slightly deeper
    const bass = audioCtx.createBiquadFilter();
    bass.type = 'lowshelf'; bass.frequency.value = 180; bass.gain.value = 4;
    const comp = audioCtx.createDynamicsCompressor();
    const master = audioCtx.createGain(); master.gain.value = 1.0;
    // light metallic "AI" echo
    const delay = audioCtx.createDelay(0.1); delay.delayTime.value = 0.02;
    const fb = audioCtx.createGain(); fb.gain.value = 0.35;
    const wet = audioCtx.createGain(); wet.gain.value = 0.22;
    src.connect(bass); bass.connect(comp);
    comp.connect(master);                      // dry
    comp.connect(delay); delay.connect(fb); fb.connect(delay);
    delay.connect(wet); wet.connect(master);   // wet
    master.connect(audioCtx.destination);
    currentAudioSource = src;
    src.onended = () => resolve();
    src.start(0);
  });
}

function splitChunks(clean) {
  const parts = clean.match(/[^.!?\n]+[.!?]*\s*/g) || [clean];
  const chunks = [];
  let cur = '';
  for (const p of parts) {
    if (chunks.length === 0 && cur === '') {   // short first chunk = fast start
      let first = p.trim(), rest = '';
      if (first.length > 140) {
        let cut = first.lastIndexOf(' ', 140);
        if (cut < 40) cut = 140;
        rest = first.slice(cut) + ' ';
        first = first.slice(0, cut);
      }
      chunks.push(first);
      cur = rest;
      continue;
    }
    if (cur && (cur + p).length > 200) { chunks.push(cur.trim()); cur = p; } else cur += p;
  }
  if (cur.trim()) chunks.push(cur.trim());
  return chunks.filter(Boolean);
}

async function speakFree(chunks, myId, state) {
  const ahead = 2;
  const tasks = [];
  for (let i = 0; i < Math.min(ahead, chunks.length); i++) tasks[i] = fetchTTS(chunks[i]);
  for (let i = 0; i < chunks.length; i++) {
    if (i + ahead < chunks.length) tasks[i + ahead] = fetchTTS(chunks[i + ahead]);
    const buf = await Promise.race([
      tasks[i],
      new Promise((_, rej) => setTimeout(() => rej(new Error('TTS timeout')), i === 0 ? 3000 : 6000))
    ]);
    if (myId !== speakId) return;
    await playJarvis(buf, myId);
    if (myId !== speakId) return;
    state.done = i + 1;
  }
}

async function speakText(text, btn) {
  const wasSpeakingThis = currentSpeakingBtn === btn && (currentAudioSource || speechSynthesis.speaking);
  const hadSpeech = speechSynthesis.speaking || speechSynthesis.pending;
  stopSpeaking();
  const myId = speakId;
  if (wasSpeakingThis) return;

  const clean = stripForSpeech(text);
  if (!clean) return;

  if (btn) {
    btn.classList.add('speaking');
    btn.innerHTML = ICON_STOP;
    currentSpeakingBtn = btn;
  }

  if (hadSpeech) {
    await new Promise(r => setTimeout(r, 60));
    if (myId !== speakId) return;
  }

  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) {}

  // 1) ElevenLabs if a real key is present
  if (ELEVENLABS_API_KEY && ELEVENLABS_API_KEY !== "YOUR_ELEVENLABS_API_KEY") {
    try {
      const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${ELEVENLABS_VOICE_ID}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'xi-api-key': ELEVENLABS_API_KEY },
        body: JSON.stringify({ text: clean, model_id: "eleven_monolingual_v1",
          voice_settings: { stability: 0.5, similarity_boost: 0.85 } })
      });
      if (!response.ok) throw new Error('API Request Failed');
      const audioBuffer = await audioCtx.decodeAudioData(await response.arrayBuffer());
      const source = audioCtx.createBufferSource();
      source.buffer = audioBuffer;
      source.connect(audioCtx.destination);
      source.onended = () => { if (myId === speakId) stopSpeaking(); };
      currentAudioSource = source;
      source.start(0);
      return;
    } catch (err) {
      console.warn('ElevenLabs failed, trying free voice:', err);
    }
  }

  const chunks = splitChunks(clean);
  const state = { done: 0 };

  // 2) Free neural voice with Jarvis effect
  try {
    await speakFree(chunks, myId, state);
    if (myId === speakId) stopSpeaking();
    return;
  } catch (err) {
    console.warn('Free voice failed, using device voice:', err);
    if (myId !== speakId) return;
  }

  // 3) Device voice (instant, offline) for whatever is left
  if ('speechSynthesis' in window) {
    if (!jarvisVoice) jarvisVoice = pickJarvisVoice();
    const rest = chunks.slice(state.done);
    speechSynthesis.resume();
    rest.forEach((c, i) => {
      const utter = new SpeechSynthesisUtterance(c);
      if (jarvisVoice) utter.voice = jarvisVoice;
      utter.pitch = 0.8;
      utter.rate = 0.95;
      if (i === rest.length - 1) utter.onend = () => { if (myId === speakId) stopSpeaking(); };
      utter.onerror = (e) => { if (myId === speakId && e.error !== 'interrupted' && e.error !== 'canceled') stopSpeaking(); };
      speechSynthesis.speak(utter);
    });
  } else {
    showToast('Voice output isn\'t supported in this browser');
    stopSpeaking();
  }
}

/* Warm-up on first touch: unlocks audio + loads voices so later presses are instant */
let speakId = 0;
document.addEventListener('pointerdown', function unlockAudio() {
  try {
    if ('speechSynthesis' in window) {
      const u = new SpeechSynthesisUtterance(' ');
      u.volume = 0;
      speechSynthesis.speak(u);
      jarvisVoice = pickJarvisVoice();
    }
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) {}
}, { once: true });


function toggleAutoVoice() {
  autoVoiceMode = !autoVoiceMode;
  document.getElementById('voice-toggle').classList.toggle('on', autoVoiceMode);
  document.getElementById('voice-row').setAttribute('aria-checked', autoVoiceMode);
  showToast(autoVoiceMode ? 'Voice replies on' : 'Voice replies off');
  if (!autoVoiceMode) stopSpeaking();
}

function setBusy(b) {
  isThinking = b;
  document.getElementById('send-btn').disabled = b;
  document.getElementById('attach-btn').disabled = b;
  document.getElementById('mic-btn').disabled = b;
}

async function callCohere() {
  setBusy(true);
  const thinkingEl = showThinking();

  try {
    const lastUserMsg = messages[messages.length - 1]?.content || '';

    const resp = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: lastUserMsg,
        systemPrompt: getSystemPrompt()
      })
    });

    thinkingEl.remove();

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      const errMsg = err?.message || err?.error || `HTTP ${resp.status}`;
      appendMessage('assistant', `Something went wrong: ${errMsg}`, true);
      return;
    }

    const data = await resp.json();
    const text = typeof data === 'string' ? data : (data.text || data.message || JSON.stringify(data));

    messages.push({ role: 'assistant', content: text });
    msgCount++;
    appendMessage('assistant', text);

  } catch (e) {
    thinkingEl.remove();
    appendMessage('assistant', `Connection error: ${e.message}`, true);
  } finally {
    setBusy(false);
  }
}

function hideWelcome() {
  const w = document.getElementById('welcome');
  if (w) w.remove();
}

function showThinking() {
  const el = document.createElement('div');
  el.className = 'msg assistant';
  el.innerHTML = '<div class="dots"><i></i><i></i><i></i></div>';
  document.getElementById('chat-window').appendChild(el);
  scrollDown();
  return el;
}

function appendMessage(role, content, isError = false) {
  const win = document.getElementById('chat-window');
  const div = document.createElement('div');
  div.className = `msg ${role}`;

  const uid = ++msgUid;
  rawMessageStore[uid] = content;

  if (role === 'user') {
    div.innerHTML = `<div class="bubble">${escHtml(content)}</div>`;
  } else {
    div.innerHTML = `
      <div class="bubble${isError ? ' error' : ''}">${isError ? escHtml(content) : renderMarkdown(content)}</div>
      ${isError ? '' : `<div class="msg-actions">
        <button class="icon-btn sm" onclick="copyMessageText(this, ${uid})" title="Copy" aria-label="Copy">${ICON_COPY}</button>
        <button class="icon-btn sm msg-speak-btn" onclick="speakMessage(this, ${uid})" title="Read aloud" aria-label="Read aloud">${ICON_SPEAK}</button>
      </div>`}`;
  }

  win.appendChild(div);
  scrollDown();

  if (role === 'assistant' && !isError && autoVoiceMode) {
    speakText(content, div.querySelector('.msg-speak-btn'));
  }
  return div;
}

function speakMessage(btn, uid) {
  speakText(rawMessageStore[uid] ?? '', btn);
}

function copyMessageText(btn, uid) {
  copyToClipboard(rawMessageStore[uid] ?? '').then(() => {
    btn.innerHTML = ICON_CHECK;
    btn.classList.add('copied');
    setTimeout(() => { btn.innerHTML = ICON_COPY; btn.classList.remove('copied'); }, 1600);
    showToast('Copied');
  }).catch(() => showToast('Copy failed'));
}

function copyToClipboard(text) {
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(text);
  }
  return new Promise((resolve, reject) => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.top = '0';
      ta.style.left = '0';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      ok ? resolve() : reject(new Error('execCommand failed'));
    } catch (err) {
      reject(err);
    }
  });
}

function scrollDown() {
  const win = document.getElementById('chat-window');
  win.scrollTop = win.scrollHeight;
}

function renderMarkdown(text) {
  let codeBlocks = [];
  
  let processedText = text.replace(/```(\w+)?\n?([\s\S]*?)```/g, (_, lang, code) => {
    const id = 'code-' + Math.random().toString(36).slice(2);
    const langAttr = (lang || 'txt').toLowerCase();
    const rawCode = code.replace(/^\n+|\n+$/g, '');
    codeSnippetStore[id] = rawCode;

    const placeholder = `___CODE_BLOCK_${codeBlocks.length}___`;
    
    codeBlocks.push({
      placeholder: placeholder,
      html: `<div class="code-wrap">
        <div class="code-actions">
          <button class="copy-btn" onclick="copyCode('${id}', this)">Copy</button>
          <button class="dl-btn" onclick="downloadCode('${id}','${langAttr}')">Save</button>
        </div>
        <pre id="${id}" data-lang="${langAttr}"><code>${escHtml(rawCode)}</code></pre>
      </div>`
    });

    return placeholder;
  });

  let html = escHtml(processedText);

  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  html = html.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
  html = html.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');
  html = html.replace(/^---$/gm, '<hr>');
  html = html.replace(/^[\*\-] (.+)$/gm, '<li>$1</li>');
  html = html.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');

  html = html.replace(/<\/li>\n(?=<li>)/g, '</li>');
  html = html.replace(/(?:<li>.*?<\/li>)+/g, m => '<ul>' + m + '</ul>');
  html = html.replace(/(<\/(?:h1|h2|h3|ul|blockquote)>|<hr>)\n/g, '$1');

  codeBlocks.forEach(item => {
    html = html.replace(item.placeholder, item.html);
  });

  return html;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function copyCode(id, btn) {
  const code = codeSnippetStore[id] ?? '';
  copyToClipboard(code).then(() => {
    showToast('Code copied');
    if (btn) {
      const original = btn.textContent;
      btn.textContent = 'Copied';
      setTimeout(() => { btn.textContent = original; }, 1600);
    }
  }).catch(() => showToast('Copy failed'));
}

const EXT_MAP = {
  javascript: 'js', js: 'js', typescript: 'ts', ts: 'ts',
  python: 'py', py: 'py', html: 'html', css: 'css',
  json: 'json', java: 'java', c: 'c', cpp: 'cpp', 'c++': 'cpp',
  csharp: 'cs', 'c#': 'cs', go: 'go', golang: 'go', rust: 'rs',
  php: 'php', ruby: 'rb', swift: 'swift', kotlin: 'kt',
  sql: 'sql', bash: 'sh', sh: 'sh', shell: 'sh', yaml: 'yml',
  yml: 'yml', xml: 'xml', markdown: 'md', md: 'md', txt: 'txt'
};

function downloadCode(id, lang) {
  const content = codeSnippetStore[id] ?? '';
  const ext = EXT_MAP[lang] || 'txt';
  const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${APP_NAME.toLowerCase()}_snippet_${Date.now()}.${ext}`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(a.href);
  showToast('Downloaded');
}


function clearChat() {
  stopSpeaking();
  messages = [];
  msgCount = 0;
  totalTokens = 0;
  renderWelcome();
  closeSidebarOnMobile();
  showToast('New chat');
}

function exportChat() {
  if (!messages.length) { showToast('Nothing to export'); return; }
  const txt = messages.map(m => `[${m.role.toUpperCase()}]\n${m.content}`).join('\n\n' + '─'.repeat(60) + '\n\n');
  const blob = new Blob([txt], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${APP_NAME.toLowerCase()}_chat_${Date.now()}.txt`;
  a.click();
  closeSidebarOnMobile();
  showToast('Exported');
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}
